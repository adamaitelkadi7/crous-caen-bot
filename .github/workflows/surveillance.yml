name: Surveillance CROUS Caen

on:
  # Déclencheur principal : appel externe toutes les heures (cron-job.org)
  workflow_dispatch:

  # Secours : cron natif de GitHub (peu fiable, parfois jamais déclenché)
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write   # Pour committer logements_vus.json

# Jamais deux vérifications en même temps (évite les conflits sur l'état)
concurrency:
  group: surveillance-crous
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer la surveillance
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_URL: ${{ vars.SEARCH_URL }}
        run: python crous_watch.py

      - name: Sauvegarder l'état
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logements_vus.json
          if git diff --cached --quiet; then
            echo "Rien à sauvegarder"
            exit 0
          fi
          git commit -m "🏠 État $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
