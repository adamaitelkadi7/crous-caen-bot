name: Surveillance CROUS Caen

on:
  # Toutes les heures (minute 37 pour éviter la congestion)
  schedule:
    - cron: "37 * * * *"

  # Lancement manuel depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: write   # Pour committer logements_vus.json

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer la surveillance
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_URL: ${{ vars.SEARCH_URL || 'https://trouverunlogement.lescrous.fr/tools/47/search?bounds=-0.413777_49.2162655_-0.3307282_49.1530145&locationName=Caen+%2814000%29' }}
        run: python crous_watch.py

      - name: Sauvegarder l'état
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logements_vus.json
          git diff --cached --quiet || git commit -m "🏠 Mise à jour état $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
